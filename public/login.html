<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول — Supplement by Science</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --bg2: #111118;
      --bg3: #1a1a24;
      --border: #2a2a3a;
      --primary: #7c3aed;
      --primary-light: #a78bfa;
      --primary-glow: rgba(124, 58, 237, 0.3);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --error: #ef4444;
      --success: #10b981;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Cairo', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      direction: rtl;
    }
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 600px; height: 400px;
      background: radial-gradient(ellipse, rgba(124, 58, 237, 0.12) 0%, transparent 70%);
      pointer-events: none;
    }
    .back-link {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--text); }
    .card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
      position: relative;
    }
    .logo {
      text-align: center;
      margin-bottom: 2rem;
    }
    .logo-icon {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, var(--primary), #4f46e5);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      margin: 0 auto 0.75rem;
    }
    .logo h1 {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--text);
    }
    .logo h1 span { color: var(--primary-light); }
    .tabs {
      display: flex;
      background: var(--bg3);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 2rem;
    }
    .tab {
      flex: 1;
      padding: 0.6rem;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-family: 'Cairo', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab.active {
      background: var(--primary);
      color: white;
    }
    .form { display: flex; flex-direction: column; gap: 1rem; }
    .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
    .form-label { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); }
    .form-input {
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.85rem 1rem;
      border-radius: 10px;
      font-family: 'Cairo', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-input:focus { border-color: var(--primary); }
    .form-input::placeholder { color: var(--text-dim); }
    .btn-submit {
      background: linear-gradient(135deg, var(--primary), #4f46e5);
      color: white;
      border: none;
      padding: 0.9rem;
      border-radius: 10px;
      font-family: 'Cairo', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 0.5rem;
    }
    .btn-submit:hover { transform: translateY(-1px); box-shadow: 0 4px 20px var(--primary-glow); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .alert {
      padding: 0.75rem 1rem;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      display: none;
    }
    .alert.error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      display: block;
    }
    .alert.success {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
      display: block;
    }
    .divider {
      text-align: center;
      color: var(--text-dim);
      font-size: 0.8rem;
      margin: 0.5rem 0;
      position: relative;
    }
    .divider::before, .divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 40%;
      height: 1px;
      background: var(--border);
    }
    .divider::before { right: 0; }
    .divider::after { left: 0; }
    .admin-hint {
      text-align: center;
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      font-size: 0.8rem;
      color: var(--text-dim);
    }
    .admin-hint a {
      color: var(--primary-light);
      text-decoration: none;
    }
    .spinner-inline {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-left: 0.5rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <a href="/" class="back-link">← العودة للرئيسية</a>

  <div class="card">
    <div class="logo">
      <div class="logo-icon">💊</div>
      <h1>Supplement <span>by Science</span></h1>
    </div>

    <div class="tabs">
      <button class="tab active" id="loginTab" onclick="switchTab('login')">تسجيل الدخول</button>
      <button class="tab" id="registerTab" onclick="switchTab('register')">إنشاء حساب</button>
    </div>

    <!-- Login Form -->
    <div id="loginForm">
      <div id="loginAlert" class="alert"></div>
      <div class="form">
        <div class="form-group">
          <label class="form-label">البريد الإلكتروني</label>
          <input type="email" class="form-input" id="loginEmail" placeholder="example@email.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label">كلمة المرور</label>
          <input type="password" class="form-input" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
        </div>
        <button class="btn-submit" id="loginBtn" onclick="doLogin()">تسجيل الدخول</button>
      </div>
    </div>

    <!-- Register Form -->
    <div id="registerForm" style="display:none;">
      <div id="registerAlert" class="alert"></div>
      <div class="form">
        <div class="form-group">
          <label class="form-label">الاسم الكامل</label>
          <input type="text" class="form-input" id="regName" placeholder="محمد أحمد" autocomplete="name">
        </div>
        <div class="form-group">
          <label class="form-label">البريد الإلكتروني</label>
          <input type="email" class="form-input" id="regEmail" placeholder="example@email.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label">كلمة المرور (6 أحرف على الأقل)</label>
          <input type="password" class="form-input" id="regPassword" placeholder="••••••••" autocomplete="new-password">
        </div>
        <button class="btn-submit" id="registerBtn" onclick="doRegister()">إنشاء الحساب</button>
      </div>
    </div>

    <div class="admin-hint">
      للوصول للوحة التحكم: <a href="/admin/">لوحة المسؤول</a>
    </div>
  </div>

<script>
function switchTab(tab) {
  document.getElementById('loginTab').classList.toggle('active', tab === 'login');
  document.getElementById('registerTab').classList.toggle('active', tab === 'register');
  document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
}

function showAlert(id, msg, type) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.className = `alert ${type}`;
}

function setLoading(btnId, loading) {
  const btn = document.getElementById(btnId);
  if (loading) {
    btn.disabled = true;
    btn.innerHTML = btn.textContent + '<span class="spinner-inline"></span>';
  } else {
    btn.disabled = false;
    btn.innerHTML = btn.textContent.replace(/\s*$/, '');
  }
}

async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  if (!email || !password) {
    showAlert('loginAlert', 'يرجى إدخال البريد الإلكتروني وكلمة المرور', 'error');
    return;
  }
  document.getElementById('loginBtn').disabled = true;
  document.getElementById('loginBtn').textContent = 'جاري تسجيل الدخول...';
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok) {
      showAlert('loginAlert', data.error || 'حدث خطأ', 'error');
      document.getElementById('loginBtn').disabled = false;
      document.getElementById('loginBtn').textContent = 'تسجيل الدخول';
      return;
    }
    localStorage.setItem('token', data.token);
    localStorage.setItem('user', JSON.stringify(data.user));
    showAlert('loginAlert', 'تم تسجيل الدخول بنجاح! جاري التوجيه...', 'success');
    setTimeout(() => {
      if (data.user.role === 'admin') {
        window.location.href = '/admin/';
      } else {
        window.location.href = '/user/';
      }
    }, 1000);
  } catch (e) {
    showAlert('loginAlert', 'حدث خطأ في الاتصال بالخادم', 'error');
    document.getElementById('loginBtn').disabled = false;
    document.getElementById('loginBtn').textContent = 'تسجيل الدخول';
  }
}

async function doRegister() {
  const name = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const password = document.getElementById('regPassword').value;
  if (!name || !email || !password) {
    showAlert('registerAlert', 'يرجى ملء جميع الحقول', 'error');
    return;
  }
  if (password.length < 6) {
    showAlert('registerAlert', 'كلمة المرور يجب أن تكون 6 أحرف على الأقل', 'error');
    return;
  }
  document.getElementById('registerBtn').disabled = true;
  document.getElementById('registerBtn').textContent = 'جاري إنشاء الحساب...';
  try {
    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, password }),
    });
    const data = await res.json();
    if (!res.ok) {
      showAlert('registerAlert', data.error || 'حدث خطأ', 'error');
      document.getElementById('registerBtn').disabled = false;
      document.getElementById('registerBtn').textContent = 'إنشاء الحساب';
      return;
    }
    localStorage.setItem('token', data.token);
    localStorage.setItem('user', JSON.stringify(data.user));
    showAlert('registerAlert', 'تم إنشاء الحساب بنجاح! جاري التوجيه...', 'success');
    setTimeout(() => {
      window.location.href = '/user/';
    }, 1000);
  } catch (e) {
    showAlert('registerAlert', 'حدث خطأ في الاتصال بالخادم', 'error');
    document.getElementById('registerBtn').disabled = false;
    document.getElementById('registerBtn').textContent = 'إنشاء الحساب';
  }
}

// Enter key support
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (document.getElementById('loginForm').style.display !== 'none') {
      doLogin();
    } else {
      doRegister();
    }
  }
});

// Check if already logged in
const token = localStorage.getItem('token');
if (token) {
  const user = JSON.parse(localStorage.getItem('user') || '{}');
  if (user.role === 'admin') {
    window.location.href = '/admin/';
  } else {
    window.location.href = '/user/';
  }
}
</script>
</body>
</html>
